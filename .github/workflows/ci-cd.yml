# Pin actions to commit SHAs for supply-chain security.
# Use `npx pin-github-action` or https://github.com/sethvargo/ratchet to automate.
# DO NOT use fake/invented SHAs — verify at https://github.com/<action>/commits/<tag>

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race ./...

      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binary
        run: go build -o app .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-app
          path: app

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires an all-lowercase repository name, but this repo is
      # "NewBeeFly/goTest" — lowercase owner and repo before building the tag.
      - name: Compute lowercase image tag
        run: echo "IMAGE=ghcr.io/${REPO,,}" >> "$GITHUB_ENV"
        env:
          REPO: ${{ github.repository }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      - name: Export image digest
        run: echo "IMAGE_DIGEST=${{ steps.build-push.outputs.digest }}" >> $GITHUB_ENV

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=0
          for name in TENCENT_HOST TENCENT_USERNAME TENCENT_PASSWORD TENCENT_PORT; do
            val="${!name}"
            # TEMP DIAGNOSTIC: distinguish "env var never arrived" from "secret is empty".
            echo "$name: present=$([ -v "$name" ] && echo yes || echo no) length=${#val}"
            if [ -z "$val" ]; then
              echo "::error::$name is unset or empty — add it in Settings → Secrets and variables → Actions"
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy to Tencent Cloud via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USERNAME }}
          password: ${{ secrets.TENCENT_PASSWORD }}
          port: ${{ secrets.TENCENT_PORT }}
          script: |
            cd /opt/goTest
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f
