# Pin actions to commit SHAs for supply-chain security.
# Use `npx pin-github-action` or https://github.com/sethvargo/ratchet to automate.
# DO NOT use fake/invented SHAs — verify at https://github.com/<action>/commits/<tag>

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race ./...

      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binary
        run: go build -o app .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-app
          path: app

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires an all-lowercase repository name, but this repo is
      # "NewBeeFly/goTest" — lowercase owner and repo before building the tag.
      - name: Compute lowercase image tag
        run: echo "IMAGE=ghcr.io/${REPO,,}" >> "$GITHUB_ENV"
        env:
          REPO: ${{ github.repository }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      - name: Export image digest
        run: echo "IMAGE_DIGEST=${{ steps.build-push.outputs.digest }}" >> $GITHUB_ENV

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Validate required secrets
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_USERNAME: ${{ secrets.TENCENT_USERNAME }}
          TENCENT_PASSWORD: ${{ secrets.TENCENT_PASSWORD }}
          TENCENT_PORT: ${{ secrets.TENCENT_PORT }}
        run: |
          missing=0
          for name in TENCENT_HOST TENCENT_USERNAME TENCENT_PASSWORD TENCENT_PORT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is unset or empty"
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy to Tencent Cloud via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USERNAME }}
          password: ${{ secrets.TENCENT_PASSWORD }}
          port: ${{ secrets.TENCENT_PORT }}
          script: |
            set -e

            DEPLOY_DIR="/opt/goTest"
            REPO_URL="https://github.com/NewBeeFly/goTest.git"
            SSH_USER="${{ secrets.TENCENT_USERNAME }}"

            echo "=== Go toolchain ==="
            GO_BIN="$(command -v go)"
            if [ -z "$GO_BIN" ]; then
              echo "::error::Go is not installed on this server"
              exit 1
            fi
            "$GO_BIN" version

            echo "=== Prepare directory ==="
            sudo mkdir -p "$DEPLOY_DIR"
            # Ensure the SSH user owns the directory so git can write into it.
            current_owner="$(stat -c '%U' "$DEPLOY_DIR")"
            if [ "$current_owner" != "$SSH_USER" ]; then
              sudo chown "$SSH_USER:$SSH_USER" "$DEPLOY_DIR"
            fi

            echo "=== Git pull ==="
            if [ -d "$DEPLOY_DIR/.git" ]; then
              git -C "$DEPLOY_DIR" checkout main
              if ! git -C "$DEPLOY_DIR" pull origin main; then
                echo "::error::git pull failed — this server cannot reach github.com:443."
                echo "::error::Fix outbound network or deploy the binary via scp instead."
                exit 1
              fi
            else
              # Clean up any leftover non-git files from a previous failed run.
              sudo rm -rf "${DEPLOY_DIR:?}"/*
              git clone "$REPO_URL" "$DEPLOY_DIR"
            fi

            echo "=== Build ==="
            "$GO_BIN" build -o "$DEPLOY_DIR/app" "$DEPLOY_DIR"

            echo "=== Restart ==="
            pkill -f "$DEPLOY_DIR/app" 2>/dev/null || true
            sleep 1
            nohup "$DEPLOY_DIR/app" > "$DEPLOY_DIR/app.log" 2>&1 &
            disown $!
            sleep 2

            echo "=== Status ==="
            ps aux | grep "$DEPLOY_DIR/app" | grep -v grep || echo "(process not listed yet — checking log)"
            echo "=== Last 20 log lines ==="
            tail -20 "$DEPLOY_DIR/app.log" 2>/dev/null || echo "(log not yet available)"

            echo "=== Health check ==="
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:8080/health >/dev/null 2>&1; then
                echo "Health check passed on attempt $i"
                break
              fi
              echo "Health check attempt $i failed, retrying in 2s..."
              sleep 2
            done
