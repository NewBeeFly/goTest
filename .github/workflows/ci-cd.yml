name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@f11135309ce0bb8b76b0afa6876c3e125cf46a15 # v5.3.0
        with:
          go-version: "1.22"

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race ./...

      - name: Run linter
        uses: golangci/golangci-lint-action@2c1e3b2c3e2c2e3b2c3e2c # v6.0.0
        with:
          version: v1.61

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@f11135309ce0bb8b76b0afa6876c3e125cf46a15 # v5.3.0
        with:
          go-version: "1.22"

      - name: Build binary
        run: go build -o app .

      - name: Upload artifact
        uses: actions/upload-artifact@5b417f7ce0e2757d3b1f61479f66a9f3f4d7f5b0 # v4.3.1
        with:
          name: go-app
          path: app

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b33433a0aac2a0df79a6ffab5b2e1c3e6e3f # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/goTest:latest
