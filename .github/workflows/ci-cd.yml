# Pin actions to commit SHAs for supply-chain security.
# Use `npx pin-github-action` or https://github.com/sethvargo/ratchet to automate.
# DO NOT use fake/invented SHAs — verify at https://github.com/<action>/commits/<tag>

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race ./...

      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binary
        run: go build -o app .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-app
          path: app

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/goTest:latest

      - name: Export image digest
        run: echo "IMAGE_DIGEST=${{ steps.build-push.outputs.digest }}" >> $GITHUB_ENV

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          : "${TENCENT_HOST:?Missing TENCENT_HOST secret}"
          : "${TENCENT_USERNAME:?Missing TENCENT_USERNAME secret}"
          : "${TENCENT_SSH_KEY:?Missing TENCENT_SSH_KEY secret}"
          : "${TENCENT_HOST_FINGERPRINT:?Missing TENCENT_HOST_FINGERPRINT secret}"

      - name: Deploy to Tencent Cloud via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USERNAME }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          port: ${{ secrets.TENCENT_PORT }}
          fingerprint: ${{ secrets.TENCENT_HOST_FINGERPRINT }}
          script: |
            cd /opt/goTest
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f
